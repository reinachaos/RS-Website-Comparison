name: Live website QA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Scope (baseline capture does not approve references)
        required: true
        type: choice
        default: full
        options:
          - full
          - smoke
          - capture-baseline

permissions:
  contents: read

concurrency:
  group: public-website-qa
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:validate
      - name: Run selected checks without masking the acceptance exit code
        shell: bash
        env:
          QA_MODE: ${{ inputs.mode }}
        run: |
          case "$QA_MODE" in
            full) npm run qa ;;
            smoke) npm run qa:smoke ;;
            capture-baseline) npm run baseline:capture ;;
            *) echo "Unsupported mode"; exit 3 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qa-evidence
          path: |
            artifacts/
            baselines/candidates/
          if-no-files-found: warn
          retention-days: 7
